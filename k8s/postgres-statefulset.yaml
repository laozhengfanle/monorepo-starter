# PostgreSQL StatefulSet
# - 单实例 StatefulSet（生产建议用云托管 RDS）
# - 环境变量通过 envFrom 引用 Secret/ConfigMap
# - 镜像：postgres:17-alpine 内置 postgres 用户 uid=70（不是 999），必须对齐
#   * runAsUser / runAsGroup / fsGroup 都设 70
#   * 若改用 postgres:17（debian based）则这些值应改回 999
# - 镜像 tag 固定为 17-alpine（不漂移；版本升级需手动改 + 跑迁移）
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: monorepo-starter
  labels:
    app: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        # postgres:17-alpine 镜像内置 postgres 用户 uid=70
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        allowPrivilegeEscalation: false # 安全基线（P3）：禁止提权
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              value: monorepo_starter
            # PGDATA 必须显式指向 postgres 用户可写的目录（fsGroup 70 后 /var/lib/postgresql/data 可写）
            # 默认 /var/lib/postgresql/data 由 postgres 用户拥有，配合 fsGroup 70 OK
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: '2'
          livenessProbe:
            exec:
              command: ['pg_isready', '-U', '$(POSTGRES_USER)']
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', '$(POSTGRES_USER)']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: monorepo-starter
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
