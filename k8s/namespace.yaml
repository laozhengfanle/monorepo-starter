# Namespace：monorepo-starter 部署目标命名空间
# 所有资源（postgres / redis / server / admin）都部署在 monorepo-starter namespace 下
apiVersion: v1
kind: Namespace
metadata:
  name: monorepo-starter
  labels:
    app.kubernetes.io/part-of: monorepo-starter
    app.kubernetes.io/name: monorepo-starter
    app.kubernetes.io/managed-by: kubectl
