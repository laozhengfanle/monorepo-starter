# Server Secret 模板：敏感环境变量
# - 真正的 Secret 资源**不要**提交到 Git（kubectl apply -f 后含明文）；
#   本文件仅作模板，部署前请用以下命令之一生成真实 Secret 后再 apply：
#
#   # 方式 A：从字面量创建（推荐，值不入库）
#   kubectl -n monorepo-starter create secret generic server-secrets \
#     --from-literal=JWT_SECRET='<至少16字符随机串>'
#
#   # 方式 B：用 sealed-secrets / external-secrets / SOPS 等加密方案
#   # （生产推荐，凭据不进 Git 明文）
#
# - JWT_SECRET 必须至少 16 字符（启动时由 env.validation.ts 强校验）；
#   建议 `openssl rand -hex 32` 生成 64 字符随机串。
# - 本文件保留为占位模板：apply 后必须立即覆盖（kubectl apply -f 不会因空值报错）
apiVersion: v1
kind: Secret
metadata:
  name: server-secrets
  namespace: monorepo-starter
  labels:
    app: server
    app.kubernetes.io/part-of: monorepo-starter
type: Opaque
stringData:
  # === 必填（启动 fail-fast） ===
  # JWT 签名密钥（至少 16 字符，强烈建议 32+ 字符随机串）
  JWT_SECRET: '<REPLACE_ME_WITH_OPENSSL_RAND_HEX_32>'
