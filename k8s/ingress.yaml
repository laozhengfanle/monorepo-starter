# Server Ingress：暴露 /api 与 /graphql 到 server-service
# - cert-manager 自动签发 TLS
# - Nginx Ingress Controller
# - /api 路径通过 rewrite-target 去掉 /api 前缀（NestJS 控制器是 /auth/login 等，无 /api 前缀）：
#     path: /api(/|$)(.*)   →   rewrite-target: /$2
#     /api/auth/login       →   /auth/login
# - 限流用合法注解 limit-rps（nginx.ingress.kubernetes.io/rate-limit 不是合法注解，已删除）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server-ingress
  namespace: monorepo-starter
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '60'
    # 每秒请求数限流（合法注解：limit-rps / limit-connections / limit-rpm）
    nginx.ingress.kubernetes.io/limit-rps: '100'
    # /api 路径重写：把 /api 前缀剥掉（与 admin nginx /api/ 反代行为对齐）
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com # 替换为实际域名
      secretName: server-tls
  rules:
    - host: api.example.com
      http:
        paths:
          # 捕获组：$1 = 结尾斜杠或空，$2 = 剩余路径；rewrite 后只剩 /$2 = 去掉 /api 前缀的路径
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: server-service
                port:
                  number: 3301
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: server-service
                port:
                  number: 3301
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: server-service
                port:
                  number: 3301
---
# Admin Ingress：管理后台
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-ingress
  namespace: monorepo-starter
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.example.com # 替换为实际域名
      secretName: admin-tls
  rules:
    - host: admin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 80
