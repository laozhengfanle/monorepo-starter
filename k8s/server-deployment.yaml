# Server Deployment
# - NestJS 后端统一 API，2 replica 起（生产建议 ≥ 3 + HPA）
# - liveness / readiness / startup 三种探针（/health/liveness、/health/readiness）
# - 优雅关闭：preStop sleep 5（让 Service 端点摘除完成）
# - 环境变量通过 envFrom 引用 ConfigMap + Secret
# - 镜像 tag 占位：<registry>/monorepo-starter-server:<tag>
# - 上传持久化：PVC server-uploads 挂载到 /app/uploads（readOnlyRootFilesystem 下挂载点仍可写；
#   生产大流量建议替换为云盘/对象存储，上传走 S3 等）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: monorepo-starter
  labels:
    app: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # nestjs 用户（与 Dockerfile 一致）
        runAsGroup: 1001
        fsGroup: 1001 # 让 PVC 卷组可写（nestjs uid 1001 属于该组）
        readOnlyRootFilesystem: true
      containers:
        - name: server
          image: <registry>/monorepo-starter-server:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3301
              name: http
          envFrom:
            - configMapRef:
                name: server-config
            - secretRef:
                name: server-secrets
          volumeMounts:
            # 上传文件目录（Dockerfile 已 mkdir /app/uploads 并 chown nestjs:nodejs）
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: '1'
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 3301
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 3301
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 3301
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']
      terminationGracePeriodSeconds: 30
---
# HorizontalPodAutoscaler：2-5 replica 自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: server-hpa
  namespace: monorepo-starter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: server
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
---
# Server Service
apiVersion: v1
kind: Service
metadata:
  name: server-service
  namespace: monorepo-starter
  labels:
    app: server
spec:
  type: ClusterIP
  ports:
    - port: 3301
      targetPort: 3301
      protocol: TCP
      name: http
  selector:
    app: server
