# ============================================
# 生产编排（PRODUCTION）
# ============================================
# 服务：server / admin / postgres / redis
# 不含 adminer（dev only）
#
# 所有端口、版本、凭据、资源限制均通过变量配置。
# 启动前创建 .env.production 文件：
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# 资源：所有服务声明 cpus / memory / pids_limit（防资源争抢）
# 安全：所有服务 security_opt no-new-privileges；server/admin/postgres/redis 全部非 root 运行
# 镜像：IMAGE_REPOSITORY_OWNER 与 IMAGE_TAG 必填（fail-fast，禁止 your-org/latest 占位默认值）
# ============================================

name: ${COMPOSE_PROJECT_NAME:-monorepo-starter-prod}

services:
  # ==========================================
  # Backend: NestJS
  # ==========================================
  server:
    # IMAGE_REPOSITORY_OWNER / IMAGE_TAG 必填（`:?` fail-fast，P3 基础设施项）：
    #   - 不再提供 your-org / latest 占位默认值——生产编排必须显式指定发布仓库 owner 与
    #     真实版本 tag（禁止 latest，发布不可复现）；部署时由 deploy.yml 在 SSH 脚本里
    #     export IMAGE_TAG=<真实版本> 注入，.env.production 里配 IMAGE_REPOSITORY_OWNER。
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY_OWNER:?IMAGE_REPOSITORY_OWNER 必填（发布镜像的 GHCR owner）}/monorepo-starter-server:${IMAGE_TAG:?IMAGE_TAG 必填（真实版本，禁止 latest）}
    container_name: ${COMPOSE_PROJECT_NAME:-monorepo-starter}-server
    restart: unless-stopped
    user: '${SERVER_UID:-1001}:${SERVER_UID:-1001}'
    security_opt:
      - no-new-privileges:true
    read_only: true
    # 上传文件持久化：挂载命名卷到 /app/uploads。
    # read_only: true 只禁止根文件系统写入，命名卷挂载点本身可写（Dockerfile 已 mkdir 并 chown 给 nestjs:1001）
    volumes:
      - uploads-data:/app/uploads
    tmpfs:
      - /tmp:size=100m,mode=1777
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 3301
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-monorepo_starter}?schema=public
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必填}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${SERVER_PORT:-3301}:3301'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--spider',
          '-q',
          'http://127.0.0.1:3301/health/readiness',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          memory: 256M

  # ==========================================
  # Admin: nginx 静态服务
  # ==========================================
  admin:
    # nginx 官方镜像内置 nginx 用户 uid=101，显式声明非 root（与 k8s admin-deployment 对齐）；
    # read_only 下可写目录全部由 tmpfs 提供（/var/cache/nginx 渲染配置、/var/run pid、/tmp），
    # uid 101 对 tmpfs(1777) 可写，entrypoint 渲染与 nginx 缓存均正常。
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPOSITORY_OWNER:?IMAGE_REPOSITORY_OWNER 必填（发布镜像的 GHCR owner）}/monorepo-starter-admin:${IMAGE_TAG:?IMAGE_TAG 必填（真实版本，禁止 latest）}
    container_name: ${COMPOSE_PROJECT_NAME:-monorepo-starter}-admin
    restart: unless-stopped
    user: '101:101'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=8m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      # 反代上游：compose 网络内通过服务名解析
      UPSTREAM_SERVER: server:3301
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '127.0.0.1:${ADMIN_PORT:-3302}:80'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ==========================================
  # PostgreSQL
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-monorepo-starter}-postgres
    restart: unless-stopped
    # postgres:17-alpine 内置 postgres 用户 uid=70（不是 999，与 k8s postgres-statefulset 对齐）。
    # 非 root 运行下官方 entrypoint 直接用当前用户 initdb/起库；postgres-data 命名卷首建时
    # 从镜像继承 postgres(70) 属主，写入权限成立。
    user: '70:70'
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      POSTGRES_DB: ${POSTGRES_DB:-monorepo_starter}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-monorepo_starter}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-monorepo-starter}-redis
    restart: unless-stopped
    # redis 官方镜像默认即 redis 用户（uid 999），显式声明非 root（与 k8s redis-statefulset 对齐）；
    # appendonly 写 /data，redis-data 命名卷首建时继承镜像 redis(999) 属主。
    user: '999:999'
    security_opt:
      - no-new-privileges:true
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

volumes:
  postgres-data:
  redis-data:
  # 上传文件持久卷（server 服务挂载到 /app/uploads；read_only 根文件系统下卷挂载点仍可写）
  uploads-data:
