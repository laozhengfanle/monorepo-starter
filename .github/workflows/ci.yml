name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 计算 affected 所需的 base/head（必须在 install 前设置，供 nx-set-shas 使用）
      - uses: nrwl/nx-set-shas@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # lint = oxlint 全仓快速代码规则；边界规则由 ESLint 单独检查
      - run: pnpm lint

      - run: pnpm lint:boundaries

      # 先显式生成 API client（缓存命中时秒回），保证后续 typecheck/build 使用确定的产物；
      # admin:typecheck 的缓存 inputs 已包含 api-client 源码，避免 orval 重写文件引发的
      # tsc 增量竞态（此前用 --skip-nx-cache 重试兜底，属掩盖根因）。
      - run: pnpm exec nx run @starter/api-client:generate-api

      - run: pnpm exec nx affected -t test build typecheck --base=origin/main --head=HEAD

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec nx affected -t e2e --base=origin/main --head=HEAD
