# ============================================
# CI 主流程（push main + PR）
# 覆盖：lint → typecheck → test → build → e2e → 安全审计 → Docker 构建 + Trivy 扫描
# 基于 Nx affected 增量执行；矩阵验证 node/pnpm 多版本
#
# 安全（P3）：第三方 actions 一律钉 commit SHA（防供应链投毒，tag 可被移动）。
#   版本号保留在行尾注释；升级 = 用 `git ls-remote <repo> refs/tags/<major>` 取新 SHA 后替换。
# ============================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 取消同 branch 旧的 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则
permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

jobs:
  # ============================================
  # Job 1: lint + typecheck + test + build + e2e（fast feedback）
  # ============================================
  lint-test-build:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 多版本验证矩阵（默认只跑 node 24；如需矩阵验证放开注释）
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.x']
        # node-version: ['22.x', '24.x']

    # 测试所需基础设施：server 的 e2e 测试（api.e2e.spec.ts）会真连 PostgreSQL + Redis，
    # 没有 services 时 createApp() 直连失败 → CI 必红。此处按 GitHub Actions 标准配置。
    services:
      postgres:
        # 与 compose/k8s 对齐（P2-10）：postgres:17-alpine
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monorepo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monorepo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 指向本 job 的 postgres service（GitHub Actions 将服务端口映射到 localhost）
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monorepo_test?schema=public
      # e2e 登录/签发 JWT 需要（env schema 要求 ≥16 字符）
      JWT_SECRET: ci-test-jwt-secret-0123456789

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # 计算 affected 所需的 base/head（必须在 install 前设置，供 nx-set-shas 使用）
      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # 显式缓存 pnpm store（与 setup-node 的 cache: pnpm 互补）
      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ env.PNPM_VERSION }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-${{ env.PNPM_VERSION }}-

      - run: pnpm install --frozen-lockfile

      # lint = oxlint 全仓快速代码规则；边界规则由 ESLint 单独检查
      - run: pnpm lint

      - run: pnpm lint:boundaries

      # 依赖安全审计（high 及以上阻断）
      - name: Security audit
        run: pnpm audit --audit-level=high

      # 准备测试数据库（server 的 e2e 会真连库，需要 schema + 种子数据）：
      #   1. 生成 Prisma client（gitignored，CI 需现场生成，测试代码 import 它）
      #   2. 应用全部迁移
      #   3. 灌入种子数据（e2e 登录依赖 root/Root!123）
      # 注意：e2e spec 已加 describe.skipIf(!DATABASE_URL) 保护，无 DATABASE_URL 时自动跳过
      - name: Prepare test database (prisma generate + migrate + seed)
        run: |
          pnpm exec nx run server:prisma-generate
          cd apps/server
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      # 先显式生成 API client（缓存命中时秒回），保证后续 typecheck/build 使用确定的产物
      - run: pnpm exec nx run @starter/api-client:generate-api

      # test 单独跑并携带 --coverage（触发 vitest coverage thresholds 校验）；
      # build/typecheck 与 test 分开，避免 --coverage 被透传给非 vitest 目标
      - run: pnpm exec nx affected -t test --coverage --base=origin/main --head=HEAD

      - run: pnpm exec nx affected -t build typecheck --base=origin/main --head=HEAD

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec nx affected -t e2e --base=origin/main --head=HEAD

  # ============================================
  # Job 2: 构建 Docker 镜像 + Trivy 安全扫描
  # ============================================
  build-and-scan:
    name: Build Docker + Trivy Scan
    runs-on: ubuntu-latest
    needs: lint-test-build
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write # 上传 SARIF 需要

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build server image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: admin:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (server)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: server:ci-${{ github.sha }}
          format: sarif
          output: trivy-server.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Trivy scan (admin)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: admin:ci-${{ github.sha }}
          format: sarif
          output: trivy-admin.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: trivy-server.sarif

      - name: Upload Trivy results (admin)
        if: always()
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: trivy-admin.sarif
