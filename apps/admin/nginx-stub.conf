# apps/admin/nginx-stub.conf — admin stub 配置（运行时 include 渲染后的 nginx 配置）
#
# 为什么不直接 COPY nginx.conf 为 default.conf？
#   k8s 下 readOnlyRootFilesystem=true 时 /etc/nginx/conf.d/ 是只读，
#   容器启动时 envsubst 渲染的 default.conf 必须写到 emptyDir 挂载点。
#   这个 stub 放在只读 conf.d，把渲染产物（emptyDir 内）include 进来。
#
# 完整链路：
#   1) 构建时：apps/admin/nginx.conf 被复制为 default.conf.template（不被自动加载）
#   2) 构建时：本文件被复制为 00-render-include.conf（按字母序最先加载）
#   3) 启动时：entrypoint.sh envsubst default.conf.template → /var/cache/nginx/default.conf
#   4) nginx 解析 conf.d/ 时执行本 stub，把 /var/cache/nginx/default.conf 内容并入 http {} 块

include /var/cache/nginx/default.conf;
