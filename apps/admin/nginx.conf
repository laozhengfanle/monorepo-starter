# apps/admin/nginx.conf — Admin 管理后台 nginx 配置
#
# 部署位置：容器内 /etc/nginx/conf.d/default.conf
# 监听端口：80
# 反代目标：由 env UPSTREAM_SERVER 注入（docker compose 下默认 server:3301，
#   k8s 下通过 admin-deployment env 注入为 server-service:3301）
#
# 模板机制：
#   - 此文件是模板（包含 ${UPSTREAM_SERVER} 占位）
#   - 容器启动时 entrypoint.sh 跑 envsubst 渲染到 /etc/nginx/conf.d/default.conf
#   - 同一份模板适配 compose / k8s 两套部署
#
# 功能：
#   1. 静态资源服务（vite build 产物） + 1 年强缓存
#   2. SPA fallback：所有未匹配路径回退到 /index.html，由 react-router 接管
#   3. /api/ 反代到 server 服务的 REST 端点（剥离 /api 前缀，与 vite dev proxy 一致）
#   4. /graphql 反代到 server 服务的 GraphQL endpoint（含 WebSocket 支持）
#   5. /uploads/ 反代到 server 服务的静态资源（用户头像等）
#   6. 安全头（CSP / X-Frame-Options / X-Content-Type-Options / Referrer-Policy）
#   7. gzip 压缩

# ===== gzip 压缩 =====
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/wasm;

# ===== 真实 IP 还原 =====
real_ip_header X-Forwarded-For;
set_real_ip_from 172.16.0.0/12;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ===== 安全头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'self'; form-action 'self'; base-uri 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    # ===== 上传文件大小限制 =====
    client_max_body_size 10M;
    server_tokens off;

    # ===== SPA fallback =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 静态资源强缓存 =====
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== REST API 反代 =====
    # /api/* 转发到 server（NestJS REST 控制器），剥离 /api 前缀（与 vite dev proxy 一致）
    # UPSTREAM_SERVER 由容器启动时 envsubst 注入：
    #   - compose: server:3301
    #   - k8s:     server-service:3301
    location /api/ {
        proxy_pass http://${UPSTREAM_SERVER}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ===== GraphQL endpoint 反代（含 WebSocket 支持） =====
    location /graphql {
        proxy_pass http://${UPSTREAM_SERVER};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ===== 上传文件反代 =====
    location /uploads/ {
        proxy_pass http://${UPSTREAM_SERVER};
        proxy_set_header Host $host;
    }

    # ===== 隐藏敏感文件 =====
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ===== 容器健康检查端点 =====
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
