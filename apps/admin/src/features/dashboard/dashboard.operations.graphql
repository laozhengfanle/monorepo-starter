query DashboardUsersTotal {
  users(page: 1, pageSize: 1) {
    total
  }
}

query DashboardAccountsTotal {
  adminAccounts(page: 1, pageSize: 1) {
    total
  }
}

query DashboardRolesTotal {
  adminRoles {
    id
  }
}

query DashboardRecentUsers {
  users(page: 1, pageSize: 5) {
    items {
      id
      username
      email
      role
      status
      createdAt
    }
  }
}
