  react-dom: ^19.2.8
  react-router-dom: ^7.18.2
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@apollo/client': ^3.14.1
  antd: ^6.6.1
  '@ant-design/icons': ^6.3.2
  echarts: ^6.1.0
