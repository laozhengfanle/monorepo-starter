  '@tiptap/extension-text-align': ^3.30.2
  '@tiptap/extension-underline': ^3.30.2
  dompurify: ^3.4.14
  '@tanstack/react-query': ^5.101.4
  axios: ^1.19.0
  orval: ^8.24.0

  # ---- 后端构建（webpack）与测试 ----
  webpack: ^5.109.2
  webpack-cli: ^7.2.2
  webpack-dev-server: ^6.0.0
  swc-loader: ^0.2.7
  supertest: ^7.2.2
  '@types/supertest': ^7.2.1

  # ---- 测试 ----
  '@playwright/test': ^1.62.1
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.5
  '@types/node': ^26.2.0
  '@types/multer': ^2.2.0
  multer: ^2.2.0

  # ---- Git 工程规范（husky + commitlint + lint-staged） ----
  husky: ^9.1.7
  lint-staged: ^17.3.0
  '@commitlint/cli': ^21.2.2
  '@commitlint/config-conventional': ^21.2.2

  # ---- 定时任务（@nestjs/schedule） ----
  '@nestjs/schedule': ^6.1.3

  # ---- GraphQL N+1 优化（dataloader） ----
  dataloader: ^2.2.3

  # ---- GraphQL 安全（深度限制，防递归 DoS） ----
  graphql-depth-limit: 1.1.0
  '@types/graphql-depth-limit': 1.1.6

  # ---- ERD 生成（Prisma 关系图，docs 工作流用） ----
  prisma-erd-generator: ^2.4.4

  # ---- API 文档生成（docs 工作流用） ----
  typedoc: ^0.28.20

  # ---- 后端（NestJS + Express） ----
  '@nestjs/common': ^11.2.1
  '@nestjs/core': ^11.2.1
  '@nestjs/platform-express': ^11.2.1
  '@nestjs/config': ^4.0.4
  '@nestjs/swagger': ^11.4.7
  '@nestjs/testing': ^11.2.1
  '@nestjs/graphql': ^13.4.5
  '@nestjs/apollo': ^13.4.5
  '@nestjs/jwt': ^11.0.2
  '@nestjs/throttler': ^6.5.0
  '@nestjs/terminus': ^11.1.1
  '@nestjs/websockets': ^11.2.1
  '@nestjs/platform-socket.io': ^11.2.1
  socket.io: ^4.8.3
  socket.io-client: ^4.8.3
  '@willsoto/nestjs-prometheus': ^6.1.0
  prom-client: ^15.1.3
  '@apollo/server': ^5.5.1
  '@as-integrations/express5': ^1.1.2
  graphql: ^16.14.0
  graphql-request: ^7.4.0
  bcrypt: ^6.0.0
  '@types/bcrypt': ^6.0.0
  ioredis: ^6.0.0
  '@types/ioredis': ^5.0.0
  express: ^5.2.1
  helmet: ^8.3.0
  compression: ^1.8.1
  cookie-parser: ^1.4.7
  '@types/express': ^5.0.6
  '@types/compression': ^1.8.1
  '@types/cookie-parser': ^1.4.10
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  zod: ^4.4.3
  nestjs-zod: ^5.5.0
  nestjs-pino: ^4.6.1
  pino: ^10.3.1
  pino-http: ^11.0.0
  pino-pretty: ^13.1.3
  '@types/pino-http': ^6.1.0

  # ---- 数据层（Prisma 7 + PostgreSQL） ----
