packages:
  - 'apps/*'
  - 'packages/**'

# pnpm 11: 构建脚本白名单（替代已移除的 onlyBuiltDependencies）
allowBuilds:
  nx: true
  '@swc/core': true
  '@nestjs/core': true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  unrs-resolver: true
  '@parcel/watcher': true
  less: true
  esbuild: true
  '@scarf/scarf': false
  '@apollo/protobufjs': true
  bcrypt: true
  puppeteer: set this to true or false

# 依赖版本统一由 catalog 管理；pnpm add 只允许 catalog 中已存在的包
catalogMode: strict

catalog:
  # ---- 工作区工具链（模板锁定版本） ----
  nx: 23.1.1
  '@nx/devkit': 23.1.1
  '@nx/eslint': 23.1.1
  '@nx/eslint-plugin': 23.1.1
  '@nx/js': 23.1.1
  '@nx/nest': 23.1.1
  '@nestjs/schematics': ^11.0.0
  '@nx/node': 23.1.1
  '@nx/playwright': 23.1.1
  '@nx/react': 23.1.1
  '@nx/vite': 23.1.1
  '@nx/vitest': 23.1.1
  '@nx/web': 23.1.1
  '@nx/webpack': 23.1.1
  '@nx/workspace': 23.1.1
  typescript: ^6.0.3
  typescript-eslint: ^8.67.0
  vite: ^8.2.1
  vitest: ~4.1.10
  '@vitest/coverage-v8': ~4.1.10
  '@vitest/ui': ~4.1.10
  jsdom: ^30.0.1
  '@vitejs/plugin-react': ^6.0.5
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@swc-node/register': ^1.12.1
  '@swc/cli': 0.8.1
  '@swc/core': ^1.15.47
  '@swc/helpers': ^0.5.23
  esbuild: ^0.27.7
  jiti: ^2.7.0
  ts-node: ^10.9.2
  tsx: ^4.22.4
  tslib: ^2.8.1
  '@babel/core': ^7.29.7
  '@babel/preset-react': ^7.29.7

  # ---- Lint / 格式化 ----
  # oxlint 承担全部代码规则；ESLint 仅保留 Nx 边界规则（lint:boundaries）
  oxlint: 1.78.0
  eslint: ^9.39.5
  '@eslint/js': ^9.39.5
  eslint-config-prettier: ^10.1.8
  jsonc-eslint-parser: ^2.1.0
  prettier: ^3.9.6

  # ---- 前端运行时 ----
  react: ^19.2.8
  react-dom: ^19.2.8
  react-router-dom: ^7.18.2
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@apollo/client': ^3.14.1
  antd: ^6.6.0
  '@ant-design/icons': ^6.1.0
  echarts: ^6.1.0
  '@tiptap/react': ^3.30.1
  '@tiptap/pm': ^3.30.1
  '@tiptap/starter-kit': ^3.30.1
  '@tiptap/extension-image': ^3.30.1
  '@tiptap/extension-link': ^3.30.1
  '@tiptap/extension-table': ^3.30.1
  '@tiptap/extension-placeholder': ^3.30.1
  '@tiptap/extension-text-align': ^3.30.1
  '@tiptap/extension-underline': ^3.30.1
  dompurify: ^3.4.13
  '@tanstack/react-query': ^5.0.0
  axios: ^1.7.0
  orval: ^8.24.0

  # ---- 后端构建（webpack）与测试 ----
  webpack: ^5.109.2
  webpack-cli: ^7.2.2
  webpack-dev-server: ^5.2.6
  swc-loader: ^0.2.7
  supertest: ^7.1.4
  '@types/supertest': ^6.0.3

  # ---- 测试 ----
  '@playwright/test': ^1.62.1
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.4
  '@types/node': ^24.13.3
  '@types/multer': ^2.0.0
  multer: ^2.0.0

  # ---- Git 工程规范（husky + commitlint + lint-staged） ----
  husky: ^9.1.7
  lint-staged: ^17.0.5
  '@commitlint/cli': ^21.0.2
  '@commitlint/config-conventional': ^21.0.2

  # ---- 定时任务（@nestjs/schedule） ----
  '@nestjs/schedule': ^6.1.3

  # ---- GraphQL N+1 优化（dataloader） ----
  dataloader: ^2.2.3

  # ---- ERD 生成（Prisma 关系图，docs 工作流用） ----
  prisma-erd-generator: ^2.4.4

  # ---- API 文档生成（docs 工作流用） ----
  typedoc: ^0.28.20

  # ---- 后端（NestJS + Express） ----
  '@nestjs/common': ^11.0.0
  '@nestjs/core': ^11.0.0
  '@nestjs/platform-express': ^11.0.0
  '@nestjs/config': ^4.0.0
  '@nestjs/swagger': ^11.0.0
  '@nestjs/testing': ^11.0.0
  '@nestjs/graphql': ^13.4.2
  '@nestjs/apollo': ^13.4.2
  '@nestjs/jwt': ^11.0.2
  '@nestjs/throttler': ^6.5.0
  '@nestjs/terminus': ^11.1.1
  '@nestjs/websockets': ^11.2.1
  '@nestjs/platform-socket.io': ^11.2.1
  socket.io: ^4.8.3
  socket.io-client: ^4.8.3
  '@willsoto/nestjs-prometheus': ^6.1.0
  prom-client: ^15.1.3
  '@apollo/server': ^5.5.1
  '@as-integrations/express5': ^1.1.2
  graphql: ^16.14.0
  graphql-request: ^7.4.0
  bcrypt: ^6.0.0
  '@types/bcrypt': ^5.0.2
  ioredis: ^5.11.0
  '@types/ioredis': ^5.0.0
  express: ^5.2.1
  helmet: ^8.2.0
  compression: ^1.8.1
  cookie-parser: ^1.4.7
  '@types/express': ^5.0.6
  '@types/compression': ^1.8.1
  '@types/cookie-parser': ^1.4.10
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  zod: ^4.0.0
  nestjs-zod: ^5.0.0
  nestjs-pino: ^4.6.1
  pino: ^10.3.1
  pino-http: ^11.0.0
  pino-pretty: ^13.1.3
  '@types/pino-http': ^6.1.0

  # ---- 数据层（Prisma 7 + PostgreSQL） ----
  prisma: ^7.9.1
  '@prisma/client': ^7.9.1
  '@prisma/adapter-pg': ^7.9.1
  pg: ^8.21.0
  '@types/pg': ^8.20.0
  uuidv7: ^1.2.1

  # ---- GraphQL codegen（前端类型化 hooks 生成） ----
  '@graphql-codegen/cli': ^5.0.7
  '@graphql-codegen/typescript': ^4.1.6
  '@graphql-codegen/typescript-operations': ^4.6.1
  '@graphql-codegen/typescript-react-apollo': ^4.4.2

minimumReleaseAgeExclude:
  - '@nestjs/platform-socket.io@11.2.1'
  - '@nestjs/websockets@11.2.1'
